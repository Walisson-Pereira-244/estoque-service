# Uso local: estoque + banco + Prometheus + Grafana
# Rodar:  docker compose up --build
services:
  estoque-db:
    image: postgres:14
    environment:
      POSTGRES_USER: admin_estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: estoque_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_estoque -d estoque_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  estoque-service:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://admin_estoque:${POSTGRES_PASSWORD:-troque-esta-senha}@estoque-db:5432/estoque_db
      ENABLE_DOCS: "true"
    depends_on:
      estoque-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - estoque-service

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
